<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surpac Outputs in 3D</title>
<style>
  :root{
    --orange:#e8732a;
    --orange-dim:#f3a46d;
    --black:#1a1a1a;
    --bg:#ffffff;
    --panel:#f7f7f7;
    --border:#e3e3e3;
    --text:#232323;
    --muted:#6b6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}

  header{
    display:flex;align-items:center;gap:14px;
    padding:14px 20px;border-bottom:1px solid var(--border);
    background:var(--bg);flex:0 0 auto;
  }
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);flex:0 0 auto;}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;}
  header p{margin:0;font-size:12px;color:var(--muted);}

  nav#tabs{
    display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
    padding:10px 16px;border-bottom:1px solid var(--border);
    background:var(--panel);flex:0 0 auto;
  }
  nav#tabs button{
    appearance:none;border:1px solid var(--border);background:#fff;color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
    white-space:nowrap;
  }
  .tab-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tab-group + .tab-group{padding-left:14px;border-left:1px solid var(--border);}
  .group-label{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px;}
  nav#tabs button:hover{border-color:var(--orange-dim);}
  nav#tabs button.active{background:var(--orange);border-color:var(--orange);color:#fff;}

  main{flex:1 1 auto;display:flex;min-height:0;}
  #canvas-wrap{flex:1 1 auto;position:relative;min-width:0;background:
     radial-gradient(ellipse at 50% 0%, #fbfbfb 0%, #f1f1f1 100%);}
  #canvas-wrap canvas{display:block;width:100%;height:100%;}

  #hint{
    position:absolute;left:14px;bottom:14px;font-size:11px;color:var(--muted);
    background:rgba(255,255,255,.85);padding:6px 10px;border-radius:8px;border:1px solid var(--border);
    pointer-events:none;
  }

  aside{
    width:340px;flex:0 0 auto;border-left:1px solid var(--border);background:var(--bg);
    padding:18px 18px 18px 18px;overflow-y:auto;
  }
  aside h2{font-size:15px;margin:0 0 4px 0;}
  aside .sub{font-size:12px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  aside p{font-size:13px;line-height:1.55;color:var(--text);margin:0 0 12px 0;}
  aside .usedfor{font-size:12px;color:var(--muted);margin-bottom:14px;}
  aside .usedfor b{color:var(--text);}
  aside ul.legend{list-style:none;margin:0 0 16px 0;padding:0;}
  aside ul.legend li{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:7px;color:var(--text);}
  aside ul.legend .swatch{width:13px;height:13px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.15);}
  aside .controls{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}
  aside button.ctrl{
    font-size:11.5px;padding:7px 10px;border-radius:7px;border:1px solid var(--border);
    background:#fff;cursor:pointer;color:var(--text);font-weight:600;
  }
  aside button.ctrl:hover{border-color:var(--orange-dim);}
  aside .divider{height:1px;background:var(--border);margin:14px 0;}
  aside .step{
    font-size:11px;color:#fff;background:var(--black);display:inline-block;padding:2px 8px;
    border-radius:5px;margin-bottom:8px;font-weight:700;letter-spacing:.03em;
  }

  /* process tab: overlay chart + stepper */
  #overlay{
    position:absolute;top:14px;right:14px;width:320px;display:none;
    background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.06);
  }
  .ov-title{font-weight:700;font-size:12.5px;margin-bottom:8px;}
  .ov-note{color:var(--muted);font-size:11px;margin-top:6px;line-height:1.4;}
  .ov-now{font-size:12px;margin-bottom:8px;line-height:1.45;}
  .ov-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .ov-table th{font-weight:600;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--border);}
  .ov-table td{text-align:right;padding:4px 6px;border-bottom:1px solid #f0f0f0;}
  .ov-table th:first-child,.ov-table td:first-child{text-align:left;}
  .ov-table tr.hl td{background:#fdeee3;font-weight:700;}
  #overlay.wide{width:410px;}
  .ov-scroll{max-height:260px;overflow:auto;border:1px solid #f0f0f0;border-radius:8px;}
  .ov-scroll .ov-table th{position:sticky;top:0;background:#fff;}
  .ov-table.click tbody tr{cursor:pointer;}
  .ov-table.click tbody tr:hover td{background:#f7f7f7;}
  .ov-table.click tbody tr.hl td{background:#fdeee3;}
  .ov-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .ov-chips button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:600;color:var(--text);}
  .ov-chips button.on{background:var(--black);border-color:var(--black);color:#fff;}
  .ov-slider{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;}
  .ov-slider input{flex:1;accent-color:var(--orange);}
  aside .ov-table{margin:0 0 14px 0;}
  aside button.ctrl.primary{background:var(--orange);border-color:var(--orange);color:#fff;}
  aside button.ctrl:disabled{opacity:.4;cursor:default;}
  ol.steplist{list-style:none;padding:0;margin:0;}
  ol.steplist li{display:flex;gap:9px;align-items:center;font-size:12.5px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--muted);}
  ol.steplist li:hover{background:var(--panel);}
  ol.steplist li span{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto;background:#fff;color:var(--text);}
  ol.steplist li.done span{background:var(--black);border-color:var(--black);color:#fff;}
  ol.steplist li.active{background:#fdeee3;color:var(--text);font-weight:700;}
  ol.steplist li.active span{background:var(--orange);border-color:var(--orange);color:#fff;}
  .stat{display:flex;gap:10px;margin:0 0 14px 0;}
  .stat div{flex:1;background:var(--panel);border-radius:8px;padding:8px 10px;}
  .stat b{display:block;font-size:16px;}
  .stat small{color:var(--muted);font-size:11px;}

  @media (max-width: 820px){
    main{flex-direction:column;}
    aside{width:100%;border-left:none;border-top:1px solid var(--border);max-height:38%;}
    #overlay{width:auto;left:10px;right:10px;top:10px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="dot"></div>
    <div>
      <h1>Surpac inputs, outputs and process, in 3D</h1>
      <p>Illustrative 3D models of the inputs, outputs and modelling process from the Surpac doc. Schematic data, not real drillholes.</p>
    </div>
  </header>

  <nav id="tabs"></nav>

  <main>
    <div id="canvas-wrap">
      <div id="hint">drag to rotate · scroll to zoom · shift-drag to pan</div>
      <div id="overlay"></div>
    </div>
    <aside id="panel"></aside>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------------
   Shared renderer / scene plumbing
--------------------------------------------------------------------- */
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 2000);
let controls;

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

let currentScene = null;
let camTween = null;
function tweenCam(p1, t1, dur = 800) {
  camTween = { p0: camera.position.clone(), p1, t0: controls.target.clone(), t1, start: performance.now(), dur };
}
let animHandle = null;

function setScene(buildFn) {
  cancelAnimationFrame(animHandle);
  camTween = null;
  if (controls) controls.dispose();

  const scene = new THREE.Scene();
  scene.background = null;

  // lighting common to all scenes
  const hemi = new THREE.HemisphereLight(0xffffff, 0xdedede, 1.1);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(120, 200, 80);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.35);
  dir2.position.set(-100, 60, -120);
  scene.add(dir2);

  const api = {
    scene,
    camPos: new THREE.Vector3(140, 110, 160),
    target: new THREE.Vector3(0, 0, 0),
    extraAnim: null
  };

  buildFn(api);

  camera.position.copy(api.camPos);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(api.target);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 20;
  controls.maxDistance = 900;
  controls.update();

  currentScene = scene;

  function loop() {
    animHandle = requestAnimationFrame(loop);
    controls.update();
    if (camTween) {
      const k = Math.min(1, (performance.now() - camTween.start) / camTween.dur);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(camTween.p0, camTween.p1, e);
      controls.target.lerpVectors(camTween.t0, camTween.t1, e);
      if (k >= 1) camTween = null;
    }
    if (api.extraAnim) api.extraAnim();
    renderer.render(currentScene, camera);
  }
  resize();
  loop();
  return api;
}

/* ---------------------------------------------------------------------
   Small helpers
--------------------------------------------------------------------- */
function grid(scene, size = 300, divisions = 20, color = 0xd8d8d8) {
  const g = new THREE.GridHelper(size, divisions, color, 0xeaeaea);
  g.position.y = 0;
  scene.add(g);
  return g;
}

function sphere(radius, color, opts = {}) {
  const geo = new THREE.SphereGeometry(radius, 20, 16);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.05, ...opts });
  return new THREE.Mesh(geo, mat);
}

function tube(points, radius, color, opts = {}) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, Math.max(8, points.length * 6), radius, 8, false);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, ...opts });
  return new THREE.Mesh(geo, mat);
}

function label3D(text, x, y, z, color = '#1a1a1a') {
  const scale = 4;
  const fontPx = 26;
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  mctx.font = `700 ${fontPx}px -apple-system, Helvetica, Arial`;
  const textW = mctx.measureText(text).width;

  const padX = 16, padY = 14;
  const cw = Math.ceil(textW + padX * 2);
  const ch = Math.ceil(fontPx + padY * 2);

  const canvas = document.createElement('canvas');
  canvas.width = cw * scale; canvas.height = ch * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.font = `700 ${fontPx}px -apple-system, Helvetica, Arial`;

  // soft rounded backing plate so labels stay legible over any surface colour
  const r = 10;
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.arcTo(cw, 0, cw, ch, r);
  ctx.arcTo(cw, ch, 0, ch, r);
  ctx.arcTo(0, ch, 0, 0, r);
  ctx.arcTo(0, 0, cw, 0, r);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, padX, ch / 2 + 1);

  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  // constant on-screen size, so labels stay readable when you zoom in or out
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, sizeAttenuation: false });
  const sprite = new THREE.Sprite(mat);
  const screenH = 0.042;
  sprite.scale.set(screenH * (cw / ch), screenH, 1);
  sprite.position.set(x, y, z);
  sprite.renderOrder = 999;
  return sprite;
}

// deterministic pseudo-random (so the "random" drillholes/grades are stable across reloads)
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(42);

// grade colour ramp: low (blue) -> mid (green/yellow) -> high (orange/red)
function gradeColor(t) {
  t = Math.max(0, Math.min(1, t));
  const stops = [
    [0.15, 0.35, 0.75],
    [0.25, 0.65, 0.45],
    [0.90, 0.75, 0.20],
    [0.91, 0.45, 0.16],
    [0.80, 0.18, 0.15]
  ];
  const n = stops.length - 1;
  const seg = Math.min(n - 1, Math.floor(t * n));
  const localT = t * n - seg;
  const c = [0, 1, 2].map(i => stops[seg][i] + (stops[seg + 1][i] - stops[seg][i]) * localT);
  return new THREE.Color(c[0], c[1], c[2]);
}

/* ---------------------------------------------------------------------
   Illustrative geometry shared across scenes: a handful of drillholes
   bending slightly with depth, and a lumpy "ore lens" solid.
--------------------------------------------------------------------- */
const HOLE_COLLARS = [
  { x: -55, z: -40, depth: 150, bendX: 14, bendZ: -8 },
  { x: -15, z: 10,  depth: 170, bendX: -6, bendZ: 18 },
  { x: 30,  z: -25, depth: 140, bendX: 20, bendZ: 10 },
  { x: 60,  z: 30,  depth: 130, bendX: -10, bendZ: -14 },
  { x: 5,   z: 55,  depth: 160, bendX: 8, bendZ: -20 }
];

function holePath(collar, nSteps = 14) {
  const pts = [];
  for (let i = 0; i <= nSteps; i++) {
    const t = i / nSteps;
    const y = -collar.depth * t;
    const x = collar.x + collar.bendX * t * t;
    const z = collar.z + collar.bendZ * t * t;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

// a smooth-ish lens shaped like an ore body: centred, tapering at edges
function lensRadiusProfile(u, v) {
  // u,v in [0,1] across a disc; returns [topY, botY] relative to a base depth
  const cx = u - 0.5, cz = v - 0.5;
  const r = Math.sqrt(cx * cx + cz * cz) * 2; // 0 centre -> ~1.4 edge
  const falloff = Math.max(0, 1 - r * r);
  const wobble = 1 + 0.12 * Math.sin(u * 14) * Math.cos(v * 11);
  const thickness = 42 * falloff * wobble;
  return thickness;
}

/* =======================================================================
   SCENE 1 — Desurveyed holes
======================================================================= */
function sceneHoles(api) {
  const { scene } = api;
  grid(scene, 300, 24);

  const surface = new THREE.Mesh(
    new THREE.CircleGeometry(170, 48),
    new THREE.MeshStandardMaterial({ color: 0xf1e9df, roughness: 1, side: THREE.DoubleSide, transparent: true, opacity: 0.55 })
  );
  surface.rotation.x = -Math.PI / 2;
  scene.add(surface);

  HOLE_COLLARS.forEach((collar, hi) => {
    const pts = holePath(collar, 18);
    const path3d = tube(pts, 1.1, 0x1a1a1a, { roughness: 0.4 });
    scene.add(path3d);

    // collar marker
    const collarMarker = sphere(2.6, 0xe8732a);
    collarMarker.position.set(collar.x, 0.5, collar.z);
    scene.add(collarMarker);
    scene.add(label3D('DH-00' + (hi + 1), collar.x, 7, collar.z));

    // sample spheres along the path at roughly-irregular intervals (pre-composite look)
    const nSamples = 8 + Math.floor(rand() * 5);
    for (let s = 1; s < nSamples; s++) {
      const t = (s / nSamples) + (rand() - 0.5) * 0.02;
      const idx = Math.min(pts.length - 1, Math.floor(t * (pts.length - 1)));
      const p = pts[idx];
      const grade = rand();
      const samp = sphere(1.7, gradeColor(grade));
      samp.position.copy(p);
      scene.add(samp);
    }
  });

  api.camPos.set(190, 140, 210);
  api.target.set(0, -70, 0);
}

/* =======================================================================
   SCENE 2 — Composites
======================================================================= */
function sceneComposites(api) {
  const { scene } = api;
  grid(scene, 220, 20);

  // Left hole: raw irregular-length samples
  const collarRaw = { x: -45, z: 0, depth: 120, bendX: 6, bendZ: -4 };
  const rawPts = holePath(collarRaw, 10);
  scene.add(tube(rawPts, 0.7, 0xbdbdbd, { roughness: 0.6 }));
  scene.add(label3D('Raw samples (irregular)', collarRaw.x, 10, collarRaw.z - 30));

  let cursor = 0;
  let segId = 0;
  while (cursor < collarRaw.depth - 2) {
    const len = 4 + rand() * 9; // irregular 4-13 m
    const from = cursor, to = Math.min(collarRaw.depth, cursor + len);
    const yFrom = -from, yTo = -to;
    const grade = rand();
    const h = Math.abs(yTo - yFrom);
    const cyl = new THREE.Mesh(
      new THREE.CylinderGeometry(2.1, 2.1, Math.max(0.6, h - 0.6), 14),
      new THREE.MeshStandardMaterial({ color: gradeColor(grade), roughness: 0.5 })
    );
    cyl.position.set(collarRaw.x, (yFrom + yTo) / 2, collarRaw.z);
    scene.add(cyl);
    cursor = to;
    segId++;
  }

  // Right hole: regularised 2 m composites
  const collarComp = { x: 45, z: 0, depth: 120, bendX: 6, bendZ: -4 };
  const compPts = holePath(collarComp, 10);
  scene.add(tube(compPts, 0.7, 0xbdbdbd, { roughness: 0.6 }));
  scene.add(label3D('Composites (2 m, equal length)', collarComp.x, 10, collarComp.z - 30));

  const compLen = 6; // drawn bigger than 2m for visibility, but equal-length
  let y = 0;
  let gi = 0;
  while (y > -collarComp.depth) {
    const grade = 0.5 + 0.5 * Math.sin(gi * 0.9) + (rand() - 0.5) * 0.25;
    const cyl = new THREE.Mesh(
      new THREE.CylinderGeometry(2.1, 2.1, compLen - 0.5, 14),
      new THREE.MeshStandardMaterial({ color: gradeColor(grade), roughness: 0.5 })
    );
    cyl.position.set(collarComp.x, y - compLen / 2, collarComp.z);
    scene.add(cyl);
    y -= compLen;
    gi++;
  }

  api.camPos.set(0, 70, 190);
  api.target.set(0, -55, 0);
}

/* =======================================================================
   SCENE 3 — DTM surface (triangulated topography)
======================================================================= */
function sceneDTM(api) {
  const { scene } = api;

  const size = 180, seg = 26;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const posAttr = geo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i), z = posAttr.getZ(i);
    const h = 16 * Math.sin(x * 0.045 + 1.3) * Math.cos(z * 0.05) +
              8 * Math.sin(x * 0.11 - z * 0.08) +
              6 * Math.cos((x + z) * 0.03);
    posAttr.setY(i, h);
  }
  geo.computeVertexNormals();

  const surfMat = new THREE.MeshStandardMaterial({
    color: 0xf3a46d, roughness: 0.85, metalness: 0.02,
    side: THREE.DoubleSide, flatShading: true
  });
  const surfMesh = new THREE.Mesh(geo, surfMat);
  scene.add(surfMesh);

  const wireMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, wireframe: true, transparent: true, opacity: 0.35 });
  const wireMesh = new THREE.Mesh(geo, wireMat);
  wireMesh.position.y += 0.08;
  scene.add(wireMesh);

  // scatter the survey points that drove the triangulation
  const pointsGeo = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i < posAttr.count; i += 7) {
    pts.push(posAttr.getX(i), posAttr.getY(i) + 0.3, posAttr.getZ(i));
  }
  pointsGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const pointsMat = new THREE.PointsMaterial({ color: 0x1a1a1a, size: 2.4 });
  scene.add(new THREE.Points(pointsGeo, pointsMat));

  // a flat reference plane far below, to show "elevation at (x,y)" concept
  const refPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
  );
  refPlane.rotation.x = -Math.PI / 2;
  refPlane.position.y = -35;
  scene.add(refPlane);

  // a vertical probe line showing "read elevation off the triangle above"
  const probeX = 20, probeZ = -10;
  // find approx height via same formula
  const probeY = 16 * Math.sin(probeX * 0.045 + 1.3) * Math.cos(probeZ * 0.05) +
                 8 * Math.sin(probeX * 0.11 - probeZ * 0.08) +
                 6 * Math.cos((probeX + probeZ) * 0.03);
  const probeMat = new THREE.LineBasicMaterial({ color: 0xe8732a });
  const probeGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(probeX, -35, probeZ), new THREE.Vector3(probeX, probeY, probeZ)
  ]);
  scene.add(new THREE.Line(probeGeo, probeMat));
  scene.add(sphere(2.2, 0xe8732a).translateX(probeX).translateY(probeY).translateZ(probeZ));
  scene.add(label3D('elevation at (x,y)', probeX, probeY + 10, probeZ));

  api.camPos.set(150, 120, 170);
  api.target.set(0, -5, 0);
}

/* =======================================================================
   SCENE 4 — Solids (wireframes): a closed mesh built from two DTM
   surfaces (roof + floor) stitched at the edges
======================================================================= */
function sceneSolid(api) {
  const { scene } = api;
  grid(scene, 220, 20);

  const radialSeg = 40, ringSeg = 14;
  const topPts = [], botPts = [];
  for (let ri = 0; ri <= ringSeg; ri++) {
    const v = ri / ringSeg;
    for (let ai = 0; ai <= radialSeg; ai++) {
      const u = ai / radialSeg;
      const ang = u * Math.PI * 2;
      const rr = v; // 0 centre .. 1 edge
      const x = Math.cos(ang) * rr * 55;
      const z = Math.sin(ang) * rr * 55;
      const uu = (x / 110) + 0.5, vv = (z / 110) + 0.5;
      const half = lensRadiusProfile(uu, vv) / 2;
      const baseY = -40;
      topPts.push(new THREE.Vector3(x, baseY + half, z));
      botPts.push(new THREE.Vector3(x, baseY - half, z));
    }
  }

  function ringMeshFromPts(pts, flip) {
    const geo = new THREE.BufferGeometry();
    const verts = [], idx = [];
    pts.forEach(p => verts.push(p.x, p.y, p.z));
    for (let ri = 0; ri < ringSeg; ri++) {
      for (let ai = 0; ai < radialSeg; ai++) {
        const a = ri * (radialSeg + 1) + ai;
        const b = a + 1;
        const c = a + (radialSeg + 1);
        const d = c + 1;
        if (flip) { idx.push(a, c, b, b, c, d); }
        else { idx.push(a, b, c, b, d, c); }
      }
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }

  const topGeo = ringMeshFromPts(topPts, false);
  const botGeo = ringMeshFromPts(botPts, true);

  const solidMat = new THREE.MeshStandardMaterial({
    color: 0xe8732a, roughness: 0.55, metalness: 0.05,
    transparent: true, opacity: 0.88, side: THREE.DoubleSide
  });
  scene.add(new THREE.Mesh(topGeo, solidMat));
  scene.add(new THREE.Mesh(botGeo, solidMat.clone()));

  const wireMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, wireframe: true, transparent: true, opacity: 0.25 });
  scene.add(new THREE.Mesh(topGeo, wireMat));
  scene.add(new THREE.Mesh(botGeo, wireMat.clone()));

  // labels for roof/floor concept
  scene.add(label3D('roof DTM', 0, -40 + lensRadiusProfile(0.5, 0.5) / 2 + 14, 0));
  scene.add(label3D('floor DTM', 0, -40 - lensRadiusProfile(0.5, 0.5) / 2 - 14, 0));

  api.camPos.set(150, 35, 190);
  api.target.set(0, -40, 0);
}

/* =======================================================================
   SCENE 5 — Block model: regular grid of blocks, sub-blocked at the
   solid's boundary, coded ORE/WASTE
======================================================================= */
function sceneBlocks(api) {
  const { scene } = api;
  grid(scene, 220, 20);

  const baseY = -40;
  const nx = 12, nz = 12, ny = 9;
  const bx = 9, bz = 9, by = 8;
  const originX = -nx * bx / 2, originZ = -nz * bz / 2, originY = baseY - (ny * by) / 2;

  function insideLens(x, y, z) {
    const uu = (x / 110) + 0.5, vv = (z / 110) + 0.5;
    const half = lensRadiusProfile(uu, vv) / 2;
    return Math.abs(y - baseY) < half;
  }

  const group = new THREE.Group();
  const oreMat = new THREE.MeshStandardMaterial({ color: 0xe8732a, roughness: 0.55 });
  const wasteMat = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, roughness: 0.75, transparent: true, opacity: 0.35 });
  const subOreMat = new THREE.MeshStandardMaterial({ color: 0xd65f17, roughness: 0.5 });

  for (let ix = 0; ix < nx; ix++) {
    for (let iz = 0; iz < nz; iz++) {
      for (let iy = 0; iy < ny; iy++) {
        const cx = originX + ix * bx + bx / 2;
        const cz = originZ + iz * bz + bz / 2;
        const cy = originY + iy * by + by / 2;

        // sample corners to decide: all-in (ore), all-out (waste/skip), mixed (sub-block boundary)
        const corners = [
          [cx - bx / 2, cy - by / 2, cz - bz / 2], [cx + bx / 2, cy - by / 2, cz - bz / 2],
          [cx - bx / 2, cy + by / 2, cz - bz / 2], [cx + bx / 2, cy + by / 2, cz - bz / 2],
          [cx - bx / 2, cy - by / 2, cz + bz / 2], [cx + bx / 2, cy - by / 2, cz + bz / 2],
          [cx - bx / 2, cy + by / 2, cz + bz / 2], [cx + bx / 2, cy + by / 2, cz + bz / 2]
        ];
        const insideCount = corners.filter(c => insideLens(c[0], c[1], c[2])).length;

        if (insideCount === 0) {
          // mostly skip waste blocks far from the lens to keep the scene legible;
          // draw a sparse translucent shell only near the lens footprint
          const dist = Math.hypot(cx, cz);
          if (dist < 95 && rand() < 0.12) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(bx * 0.94, by * 0.94, bz * 0.94), wasteMat);
            m.position.set(cx, cy, cz);
            group.add(m);
          }
          continue;
        }
        if (insideCount === 8) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(bx * 0.94, by * 0.94, bz * 0.94), oreMat);
          m.position.set(cx, cy, cz);
          group.add(m);
        } else {
          // boundary: render as 2x2x2 sub-blocks, mixed ore/waste colouring
          const subNX = 2, subNY = 2, subNZ = 2;
          const sbx = bx / subNX, sby = by / subNY, sbz = bz / subNZ;
          for (let sx = 0; sx < subNX; sx++) for (let sy = 0; sy < subNY; sy++) for (let sz = 0; sz < subNZ; sz++) {
            const scx = cx - bx / 2 + sbx * (sx + 0.5);
            const scy = cy - by / 2 + sby * (sy + 0.5);
            const scz = cz - bz / 2 + sbz * (sz + 0.5);
            const m = new THREE.Mesh(
              new THREE.BoxGeometry(sbx * 0.86, sby * 0.86, sbz * 0.86),
              insideLens(scx, scy, scz) ? subOreMat : wasteMat
            );
            m.position.set(scx, scy, scz);
            group.add(m);
          }
        }
      }
    }
  }
  scene.add(group);

  scene.add(label3D('ORE blocks', -90, -5, -90));
  scene.add(label3D('sub-blocks at the boundary', 70, -75, 70));

  api.camPos.set(170, 55, 210);
  api.target.set(0, -40, 0);
}

/* =======================================================================
   PROCESS TAB — one shared scene that builds up across the 9 steps
======================================================================= */
const overlay = document.getElementById('overlay');
const LENS_Y = -40;
const GREY = new THREE.Color(0xcfcfcf);
const clamp01 = v => Math.max(0, Math.min(1, v));
const fmt = n => n.toLocaleString('en-US', { maximumFractionDigits: n < 10 ? 2 : 0 });

function lensHalfAt(x, z) { return lensRadiusProfile(x / 110 + 0.5, z / 110 + 0.5) / 2; }
function insideLensP(x, y, z) { return Math.abs(y - LENS_Y) < lensHalfAt(x, z); }
function topoH(x, z) { return 3 * Math.sin(x * 0.04 + 0.5) * Math.cos(z * 0.05) + 2 * Math.sin((x - z) * 0.07); }

// the "true" grade field the drillholes sample (g/t): high in the lens centre, low outside
function trueGradeGT(x, y, z) {
  const r = Math.hypot(x, z) / 55;
  if (insideLensP(x, y, z)) {
    // broad halo that fades to the edges, plus a high-grade shoot east of centre
    const halo = 0.18 + 0.6 * Math.pow(clamp01(1 - r), 1.2);
    const shoot = 0.4 * Math.exp(-(((x - 15) ** 2) + ((z + 10) ** 2)) / (2 * 18 * 18));
    return 3 * clamp01(halo + shoot + 0.06 * Math.sin(x * 0.15) * Math.cos(z * 0.12));
  }
  return 3 * clamp01(0.08 + 0.05 * Math.sin(x * 0.1 + z * 0.07));
}

function lensGeometries() {
  const radialSeg = 40, ringSeg = 14;
  const top = [], bot = [];
  for (let ri = 0; ri <= ringSeg; ri++) {
    for (let ai = 0; ai <= radialSeg; ai++) {
      const ang = (ai / radialSeg) * Math.PI * 2, rr = ri / ringSeg;
      const x = Math.cos(ang) * rr * 55, z = Math.sin(ang) * rr * 55;
      const half = lensHalfAt(x, z);
      top.push(x, LENS_Y + half, z);
      bot.push(x, LENS_Y - half, z);
    }
  }
  function make(verts, flip) {
    const idx = [];
    for (let ri = 0; ri < ringSeg; ri++) for (let ai = 0; ai < radialSeg; ai++) {
      const a = ri * (radialSeg + 1) + ai, b = a + 1, c = a + radialSeg + 1, d = c + 1;
      if (flip) idx.push(a, c, b, b, c, d); else idx.push(a, b, c, b, d, c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    g.setIndex(idx); g.computeVertexNormals();
    return g;
  }
  return [make(top, false), make(bot, true)];
}

function cylinderBetween(a, b, radius, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dir.length(), 8), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

const PROC_COLLARS = [
  [-40, -25, 6, -3], [-10, -35, -4, 5], [20, -30, 5, -4], [45, -10, -6, 3], [-35, 10, 3, -6],
  [-5, 0, -3, 4], [25, 15, 4, -3], [-20, 38, -5, 5], [10, 40, 6, -4], [55, 30, -4, 3]
].map(([x, z, bendX, bendZ]) => ({ x, z, bendX, bendZ, depth: 95 }));

const SEARCH = { x: 45, y: 15, z: 35, max: 12, perHole: 3 };
const DENSITY = 2.85; // ORE density, as measured in the Density input tab
const PROC = { step: 0, cutoff: 1.0, tween: null };

const PROC_CAMS = [
  [[150, 40, 170], [0, -45, 0]],
  [[125, 15, 145], [0, -45, 0]],
  [[160, 60, 185], [0, -35, 0]],
  [[170, 55, 210], [0, -40, 0]],
  [[150, 35, 170], [0, -45, 0]],
  'target',
  'target2',
  [[170, 85, 200], [0, -40, 0]],
  [[0, 30, 185], [0, -40, 0]]
];

function camFor(i) {
  const c = PROC_CAMS[i];
  if (c === 'target' || c === 'target2') {
    const t = PROC.target.c;
    const off = c === 'target' ? [115, 75, 140] : [70, 95, 90];
    return [new THREE.Vector3(t.x + off[0], t.y + off[1], t.z + off[2]), t.clone()];
  }
  return [new THREE.Vector3(...c[0]), new THREE.Vector3(...c[1])];
}

function sceneProcess(api) {
  const { scene } = api;
  const prng = mulberry32(7);
  grid(scene, 260, 26);

  const G = {};
  ['topo', 'holes', 'stations', 'raw', 'comps', 'solid', 'solidWire', 'blocks', 'waste',
   'pairs', 'search', 'target', 'weights', 'swath', 'lab1', 'lab3', 'lab4'].forEach(k => {
    G[k] = new THREE.Group(); scene.add(G[k]);
  });
  PROC.G = G;

  // ---- topography DTM
  const tGeo = new THREE.PlaneGeometry(170, 170, 22, 22);
  tGeo.rotateX(-Math.PI / 2);
  const tp = tGeo.attributes.position;
  for (let i = 0; i < tp.count; i++) tp.setY(i, topoH(tp.getX(i), tp.getZ(i)));
  tGeo.computeVertexNormals();
  G.topo.add(new THREE.Mesh(tGeo, new THREE.MeshStandardMaterial({
    color: 0xf3a46d, transparent: true, opacity: 0.35, side: THREE.DoubleSide, flatShading: true, depthWrite: false })));
  G.topo.add(new THREE.Mesh(tGeo, new THREE.MeshBasicMaterial({ color: 0x1a1a1a, wireframe: true, transparent: true, opacity: 0.15 })));

  // ---- holes, survey stations, raw samples, composites
  const comps = [];
  const CL = 4;
  const compGeo = new THREE.CylinderGeometry(1.7, 1.7, CL - 0.4, 10);
  const stationGeo = new THREE.BoxGeometry(2, 2, 2);
  const stationMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
  const pathMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });

  PROC_COLLARS.forEach((c, hi) => {
    const y0 = topoH(c.x, c.z);
    const pts = [];
    for (let i = 0; i <= 18; i++) {
      const t = i / 18;
      pts.push(new THREE.Vector3(c.x + c.bendX * t * t, y0 - c.depth * t, c.z + c.bendZ * t * t));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const len = curve.getLength();
    G.holes.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.55, 6, false), pathMat));
    const col = sphere(2.2, 0xe8732a); col.position.copy(pts[0]); G.holes.add(col);
    const name = 'DH-' + String(hi + 1).padStart(2, '0');

    for (let s = 0; s <= len; s += 20) {
      const m = new THREE.Mesh(stationGeo, stationMat);
      m.position.copy(curve.getPointAt(Math.min(1, s / len)));
      G.stations.add(m);
    }

    let s = 0;
    while (s < len - 1) {
      const L = 3 + prng() * 6;
      const p = curve.getPointAt(Math.min(len, s + L / 2) / len);
      const g = trueGradeGT(p.x, p.y, p.z) * (0.8 + 0.4 * prng());
      const sp = sphere(1.4, gradeColor(g / 3)); sp.position.copy(p);
      G.raw.add(sp);
      s += L;
    }

    for (let a = 0; a + CL <= len; a += CL) {
      let g = 0;
      for (let k = 0; k < 4; k++) {
        const p = curve.getPointAt((a + (k + 0.5) * CL / 4) / len);
        g += trueGradeGT(p.x, p.y, p.z);
      }
      g = (g / 4) * (0.9 + 0.2 * prng());
      const u = (a + CL / 2) / len;
      const pm = curve.getPointAt(u);
      const base = gradeColor(g / 3);
      const mat = new THREE.MeshStandardMaterial({ color: base.clone(), roughness: 0.5 });
      const m = new THREE.Mesh(compGeo, mat);
      m.position.copy(pm);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), curve.getTangentAt(u).normalize());
      G.comps.add(m);
      comps.push({ p: pm.clone(), g, mesh: m, mat, base, hole: hi, id: `${name} ${a}–${a + CL} m`, ore: insideLensP(pm.x, pm.y, pm.z) });
    }
  });
  PROC.comps = comps;
  const oreComps = comps.filter(c => c.ore);

  G.lab1.add(label3D('collar', PROC_COLLARS[0].x, 10, PROC_COLLARS[0].z));
  G.lab1.add(label3D('survey station', PROC_COLLARS[3].x + 14, -40, PROC_COLLARS[3].z));

  // ---- ore solid
  const [topGeo, botGeo] = lensGeometries();
  const solidMat = new THREE.MeshStandardMaterial({ color: 0xe8732a, roughness: 0.55, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false });
  G.solid.add(new THREE.Mesh(topGeo, solidMat), new THREE.Mesh(botGeo, solidMat));
  const wire = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, wireframe: true, transparent: true, opacity: 0.18 });
  G.solidWire.add(new THREE.Mesh(topGeo, wire), new THREE.Mesh(botGeo, wire));
  G.lab3.add(label3D('topography DTM', -70, 12, -70));
  G.lab3.add(label3D('ore solid', 0, -6, 62));

  // ---- block model, coded against the solid
  const blocks = [];
  const nx = 12, nz = 12, ny = 7, bx = 9, by = 8, bz = 9;
  const ox = -nx * bx / 2, oz = -nz * bz / 2, oy = LENS_Y - ny * by / 2;
  const geoP = new THREE.BoxGeometry(bx * 0.94, by * 0.94, bz * 0.94);
  const geoS = new THREE.BoxGeometry(bx / 2 * 0.86, by / 2 * 0.86, bz / 2 * 0.86);
  const wasteMat = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, transparent: true, opacity: 0.14, depthWrite: false });

  function addOre(geo, c, vol, sub) {
    const mat = new THREE.MeshStandardMaterial({ color: 0xe8732a, roughness: 0.55 });
    const mesh = new THREE.Mesh(geo, mat); mesh.position.copy(c);
    G.blocks.add(mesh);
    blocks.push({ mesh, mat, c: c.clone(), vol, sub });
  }
  for (let ix = 0; ix < nx; ix++) for (let iz = 0; iz < nz; iz++) for (let iy = 0; iy < ny; iy++) {
    const c = new THREE.Vector3(ox + (ix + 0.5) * bx, oy + (iy + 0.5) * by, oz + (iz + 0.5) * bz);
    let inside = 0;
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1])
      if (insideLensP(c.x + sx * bx / 2, c.y + sy * by / 2, c.z + sz * bz / 2)) inside++;
    if (inside === 0) {
      if (Math.hypot(c.x, c.z) < 95 && prng() < 0.1) {
        const m = new THREE.Mesh(geoP, wasteMat); m.position.copy(c); G.waste.add(m);
      }
    } else if (inside === 8) {
      addOre(geoP, c, bx * by * bz, false);
    } else {
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
        const sc = new THREE.Vector3(c.x + sx * bx / 4, c.y + sy * by / 4, c.z + sz * bz / 4);
        if (insideLensP(sc.x, sc.y, sc.z)) addOre(geoS, sc, bx * by * bz / 8, true);
        else { const m = new THREE.Mesh(geoS, wasteMat); m.position.copy(sc); G.waste.add(m); }
      }
    }
  }
  PROC.blocks = blocks;
  G.lab4.add(label3D('ORE blocks', -60, -5, -60));
  G.lab4.add(label3D('sub-blocks at the boundary', 60, -72, 60));

  // ---- estimation: search ellipsoid + inverse distance squared, ORE composites only
  function selectSamples(c, scale) {
    const perHole = {};
    return oreComps.map(s => {
      const dx = (s.p.x - c.x) / (SEARCH.x * scale), dy = (s.p.y - c.y) / (SEARCH.y * scale), dz = (s.p.z - c.z) / (SEARCH.z * scale);
      return { s, d2: dx * dx + dy * dy + dz * dz, dist: s.p.distanceTo(c) };
    }).filter(o => o.d2 <= 1).sort((a, b) => a.d2 - b.d2).filter(o => {
      perHole[o.s.hole] = (perHole[o.s.hole] || 0) + 1;
      return perHole[o.s.hole] <= SEARCH.perHole;
    }).slice(0, SEARCH.max);
  }
  const oreMean = oreComps.reduce((a, c) => a + c.g, 0) / oreComps.length;
  blocks.forEach(b => {
    let sel = selectSamples(b.c, 1), pass = 1;
    if (sel.length < 2) { sel = selectSamples(b.c, 2); pass = 2; }
    if (!sel.length) { b.est = oreMean; b.sel = []; b.pass = 3; return; }
    const ws = sel.map(o => 1 / (o.dist * o.dist + 1));
    const W = ws.reduce((a, v) => a + v, 0);
    sel.forEach((o, i) => { o.w = ws[i] / W; });
    b.est = sel.reduce((a, o) => a + o.w * o.s.g, 0);
    b.sel = sel; b.pass = pass;
  });

  // target block for steps 6–7: a full ORE block near the centre with a healthy sample count
  const goal = new THREE.Vector3(8, LENS_Y, -8);
  PROC.target = blocks.filter(b => !b.sub && b.sel.length >= 5)
    .sort((a, b) => a.c.distanceTo(goal) - b.c.distanceTo(goal))[0] || blocks[0];
  const T = PROC.target;

  const ell = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 22),
    new THREE.MeshStandardMaterial({ color: 0xe8732a, transparent: true, opacity: 0.13, depthWrite: false }));
  ell.scale.set(SEARCH.x, SEARCH.y, SEARCH.z); ell.position.copy(T.c);
  const ellWire = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12),
    new THREE.MeshBasicMaterial({ color: 0xe8732a, wireframe: true, transparent: true, opacity: 0.25 }));
  ellWire.scale.copy(ell.scale); ellWire.position.copy(T.c);
  G.search.add(ell, ellWire);
  const outline = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(bx * 1.02, by * 1.02, bz * 1.02)),
    new THREE.LineBasicMaterial({ color: 0x1a1a1a }));
  outline.position.copy(T.c);
  G.target.add(outline);

  const wMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
  T.sel.forEach(o => G.weights.add(cylinderBetween(T.c, o.s.p, 0.2 + 1.6 * o.w, wMat)));

  // ---- variogram: pairs of ORE composites binned by distance
  const LAG = 6, NB = 12;
  const sums = new Array(NB).fill(0), counts = new Array(NB).fill(0);
  const pairPos = [], pairCol = [];
  const pairList = [];
  for (let i = 0; i < oreComps.length; i++) for (let j = i + 1; j < oreComps.length; j++) {
    const h = oreComps[i].p.distanceTo(oreComps[j].p);
    const d = oreComps[i].g - oreComps[j].g;
    const bi = Math.floor(h / LAG);
    if (bi < NB) { sums[bi] += d * d; counts[bi]++; }
    if (h >= 26 && h <= 32) pairList.push([oreComps[i], oreComps[j], Math.abs(d)]);
  }
  const vbins = [];
  for (let b = 0; b < NB; b++) if (counts[b] >= 5) vbins.push({ h: (b + 0.5) * LAG, g: 0.5 * sums[b] / counts[b], n: counts[b] });
  const mean = oreMean;
  const sill = oreComps.reduce((a, c) => a + (c.g - mean) ** 2, 0) / oreComps.length;
  const nugget = vbins.length > 1 ? Math.min(0.5 * sill, Math.max(0, 2 * vbins[0].g - vbins[1].g)) : 0;
  let range = 60;
  for (const vb of vbins) if (vb.g >= 0.95 * sill) { range = vb.h; break; }
  PROC.vario = { bins: vbins, sill, nugget, range };

  const maxD = Math.max(...pairList.map(p => p[2]), 0.01);
  pairList.sort(() => prng() - 0.5).slice(0, 220).forEach(([a, b, d]) => {
    pairPos.push(a.p.x, a.p.y, a.p.z, b.p.x, b.p.y, b.p.z);
    const c = new THREE.Color(0xb0b0b0).lerp(new THREE.Color(0xe8732a), d / maxD);
    pairCol.push(c.r, c.g, c.b, c.r, c.g, c.b);
  });
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.Float32BufferAttribute(pairPos, 3));
  pg.setAttribute('color', new THREE.Float32BufferAttribute(pairCol, 3));
  G.pairs.add(new THREE.LineSegments(pg, new THREE.LineBasicMaterial({ vertexColors: true })));

  // ---- validation: swaths along east (x)
  const edges = [-60, -45, -30, -15, 0, 15, 30, 45, 60];
  PROC.swath = edges.slice(0, -1).map((x0, i) => {
    const x1 = edges[i + 1];
    const cs = oreComps.filter(c => c.p.x >= x0 && c.p.x < x1);
    const bs = blocks.filter(b => b.c.x >= x0 && b.c.x < x1);
    const bv = bs.reduce((a, b) => a + b.vol, 0);
    return {
      x: (x0 + x1) / 2,
      comp: cs.length ? cs.reduce((a, c) => a + c.g, 0) / cs.length : null,
      block: bv ? bs.reduce((a, b) => a + b.vol * b.est, 0) / bv : null,
      n: cs.length
    };
  });
  const totV = blocks.reduce((a, b) => a + b.vol, 0);
  PROC.means = { comp: oreMean, block: blocks.reduce((a, b) => a + b.vol * b.est, 0) / totV };
  const slabMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false });
  const slabEdge = new THREE.LineBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.35 });
  edges.forEach(x => {
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(120, 60), slabMat);
    pl.rotation.y = Math.PI / 2; pl.position.set(x, LENS_Y, 0);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(pl.geometry), slabEdge);
    e.rotation.y = Math.PI / 2; e.position.copy(pl.position);
    G.swath.add(pl, e);
  });

  // ---- camera tween
  api.extraAnim = () => {
    const tw = PROC.tween;
    if (!tw) return;
    const k = Math.min(1, (performance.now() - tw.start) / tw.dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(tw.p0, tw.p1, e);
    controls.target.lerpVectors(tw.t0, tw.t1, e);
    if (k >= 1) PROC.tween = null;
  };

  const [cp, ct] = camFor(PROC.step);
  api.camPos.copy(cp); api.target.copy(ct);
  applyStep(PROC.step, false);
}

const STEP_VIS = {
  topo: [3], holes: [1, 2, 3, 5], stations: [1], raw: [1], comps: [2, 3, 5, 6, 7, 9],
  solid: [3], solidWire: [3, 4, 6], blocks: [4, 6, 7, 8, 9], waste: [4], pairs: [5],
  search: [6], target: [6, 7], weights: [7], swath: [9], lab1: [1], lab3: [3], lab4: [4]
};

function setOpacity(mat, op) {
  mat.opacity = op;
  mat.transparent = op < 1;
  mat.depthWrite = op >= 1;
  mat.needsUpdate = true;
}

function styleBlocks(s) {
  PROC.blocks.forEach(b => {
    let col, op = 1;
    if (s === 4) col = new THREE.Color(b.sub ? 0xd65f17 : 0xe8732a);
    else if (s === 6) { col = new THREE.Color(0xe8732a); op = b === PROC.target ? 0.95 : 0.05; }
    else {
      col = gradeColor(b.est / 3);
      // step 7: ghost the blocks inside the search ellipsoid (and above it) so the weight lines stay visible
      if (s === 7 && b !== PROC.target) {
        const T = PROC.target.c;
        const dx = (b.c.x - T.x) / SEARCH.x, dz = (b.c.z - T.z) / SEARCH.z;
        if (dx * dx + dz * dz <= 1) op = 0.06;
      }
      if (s === 8 && b.est < PROC.cutoff - 1e-9) { col = GREY.clone(); op = 0.07; }
      if (s === 9) op = 0.4;
    }
    b.mat.color.copy(col);
    setOpacity(b.mat, op);
  });
}

function applyStep(i, animate = true) {
  PROC.step = i;
  const s = i + 1, G = PROC.G;
  for (const k in STEP_VIS) G[k].visible = STEP_VIS[k].includes(s);

  const selSet = new Set(PROC.target.sel.map(o => o.s));
  PROC.comps.forEach(c => {
    let col = c.base, op = 1, sc = 1;
    if (s === 6 || s === 7) { if (selSet.has(c)) sc = 1.5; else { col = GREY; op = 0.25; } }
    if (s === 5 && !c.ore) op = 0.2;
    c.mat.color.copy(col);
    setOpacity(c.mat, op);
    c.mesh.scale.setScalar(sc);
  });
  styleBlocks(s);

  if (s === 5) showOverlay(variogramHTML());
  else if (s === 8) { showOverlay(reportHTML()); wireReport(); }
  else if (s === 9) showOverlay(swathHTML());
  else hideOverlay();

  if (animate) {
    const [p1, t1] = camFor(i);
    PROC.tween = { p0: camera.position.clone(), p1, t0: controls.target.clone(), t1, start: performance.now(), dur: 900 };
  }
}

function showOverlay(html) { overlay.innerHTML = html; overlay.style.display = 'block'; }
function hideOverlay() { overlay.style.display = 'none'; overlay.innerHTML = ''; overlay.classList.remove('wide'); }

function svgFrame(W, H, m, xmax, ymax, xticks, yticks, xlab, ylab) {
  const x = v => m.l + (v / xmax) * (W - m.l - m.r);
  const y = v => H - m.b - (v / ymax) * (H - m.t - m.b);
  let s = `<line x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}" stroke="#bbb"/>`;
  s += `<line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H - m.b}" stroke="#bbb"/>`;
  xticks.forEach(t => { s += `<text x="${x(t)}" y="${H - m.b + 13}" font-size="10" fill="#6b6b6b" text-anchor="middle">${t}</text>`; });
  yticks.forEach(t => {
    s += `<line x1="${m.l}" y1="${y(t)}" x2="${W - m.r}" y2="${y(t)}" stroke="#f0f0f0"/>`;
    s += `<text x="${m.l - 5}" y="${y(t) + 3}" font-size="10" fill="#6b6b6b" text-anchor="end">${t}</text>`;
  });
  s += `<text x="${(m.l + W - m.r) / 2}" y="${H - 3}" font-size="10" fill="#6b6b6b" text-anchor="middle">${xlab}</text>`;
  s += `<text x="10" y="${(m.t + H - m.b) / 2}" font-size="10" fill="#6b6b6b" text-anchor="middle" transform="rotate(-90 10 ${(m.t + H - m.b) / 2})">${ylab}</text>`;
  return { s, x, y };
}

function niceTicks(max, n = 4) {
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= raw);
  const out = [];
  for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toFixed(3));
  return out;
}

function variogramHTML() {
  const V = PROC.vario, W = 290, H = 185, m = { l: 40, r: 10, t: 10, b: 30 };
  const ymax = Math.max(V.sill, ...V.bins.map(b => b.g)) * 1.2;
  const f = svgFrame(W, H, m, 72, ymax, [0, 20, 40, 60], niceTicks(ymax, 4), 'distance h (m)', 'γ(h)');
  const model = h => h <= 0 ? 0 : h >= V.range ? V.sill : V.nugget + (V.sill - V.nugget) * (1.5 * h / V.range - 0.5 * (h / V.range) ** 3);
  let path = `M ${f.x(0)} ${f.y(0)}`;
  for (let h = 0.5; h <= 72; h += 0.5) path += ` L ${f.x(h)} ${f.y(model(h))}`;
  let s = f.s;
  s += `<line x1="${f.x(0)}" y1="${f.y(V.sill)}" x2="${f.x(72)}" y2="${f.y(V.sill)}" stroke="#1a1a1a" stroke-dasharray="3 3" opacity=".4"/>`;
  s += `<text x="${f.x(70)}" y="${f.y(V.sill) - 4}" font-size="10" text-anchor="end" fill="#1a1a1a">sill</text>`;
  s += `<line x1="${f.x(V.range)}" y1="${f.y(0)}" x2="${f.x(V.range)}" y2="${f.y(V.sill)}" stroke="#1a1a1a" stroke-dasharray="3 3" opacity=".4"/>`;
  s += `<text x="${f.x(V.range) + 3}" y="${f.y(0) - 5}" font-size="10" fill="#1a1a1a">range</text>`;
  s += `<path d="${path}" fill="none" stroke="#e8732a" stroke-width="2.2"/>`;
  V.bins.forEach(b => { s += `<circle cx="${f.x(b.h)}" cy="${f.y(b.g)}" r="3.6" fill="#1a1a1a"/>`; });
  return `<div class="ov-title">Experimental variogram (dots) and spherical model</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>
    <div class="ov-note">Each dot = half the mean squared grade difference of all ORE composite pairs at that distance. Model fitted by eye.</div>`;
}

function gt(cut) {
  const sel = PROC.blocks.filter(b => b.est >= cut - 1e-9);
  const vol = sel.reduce((a, b) => a + b.vol, 0);
  const t = vol * DENSITY;
  const g = vol ? sel.reduce((a, b) => a + b.vol * b.est, 0) / vol : 0;
  return { t, g, m: t * g / 1000 };
}

function reportRows() {
  return [0, 0.5, 1.0, 1.5, 2.0, 2.5].map(c => {
    const r = gt(c);
    return `<tr class="${Math.abs(c - PROC.cutoff) < 1e-6 ? 'hl' : ''}"><td>${c.toFixed(1)}</td><td>${fmt(r.t / 1000)}</td><td>${r.g.toFixed(2)}</td><td>${fmt(r.m)}</td></tr>`;
  }).join('');
}
function reportNow() {
  const r = gt(PROC.cutoff);
  return `Above cut-off: <b>${fmt(r.t / 1000)} kt</b> at <b>${r.g.toFixed(2)} g/t</b> = <b>${fmt(r.m)} kg</b> metal`;
}
function reportHTML() {
  return `<div class="ov-title">Grade–tonnage report (ORE blocks)</div>
    <label class="ov-slider">Cut-off <b id="cut-val">${PROC.cutoff.toFixed(1)} g/t</b>
      <input type="range" id="cut" min="0" max="2.5" step="0.1" value="${PROC.cutoff}"></label>
    <div class="ov-now" id="ov-now">${reportNow()}</div>
    <table class="ov-table"><thead><tr><th>Cut-off g/t</th><th>Tonnes kt</th><th>Grade g/t</th><th>Metal kg</th></tr></thead>
    <tbody id="ov-tbody">${reportRows()}</tbody></table>
    <div class="ov-note">Tonnes = volume × ${DENSITY} t/m³. Metal = tonnes × grade. Illustrative numbers.</div>`;
}
function wireReport() {
  const el = document.getElementById('cut');
  el.addEventListener('input', () => {
    PROC.cutoff = +el.value;
    document.getElementById('cut-val').textContent = PROC.cutoff.toFixed(1) + ' g/t';
    document.getElementById('ov-now').innerHTML = reportNow();
    document.getElementById('ov-tbody').innerHTML = reportRows();
    styleBlocks(8);
  });
}

function swathHTML() {
  const W = 290, H = 185, m = { l: 40, r: 10, t: 10, b: 30 };
  const sw = PROC.swath.filter(d => d.comp !== null && d.block !== null);
  const ymax = Math.max(...sw.map(d => Math.max(d.comp, d.block))) * 1.15;
  const f = svgFrame(W, H, m, 120, ymax, [0, 30, 60, 90, 120], niceTicks(ymax, 4), 'west → east (m)', 'grade g/t');
  const X = v => f.x(v + 60);
  let s = f.s;
  const line = (key, color, dash) => `<path d="${sw.map((d, i) => `${i ? 'L' : 'M'} ${X(d.x)} ${f.y(d[key])}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.2" ${dash ? 'stroke-dasharray="4 3"' : ''}/>`;
  s += line('comp', '#1a1a1a', true) + line('block', '#e8732a', false);
  sw.forEach(d => {
    s += `<circle cx="${X(d.x)}" cy="${f.y(d.comp)}" r="3.4" fill="#1a1a1a"/>`;
    s += `<circle cx="${X(d.x)}" cy="${f.y(d.block)}" r="3.4" fill="#e8732a"/>`;
  });
  return `<div class="ov-title">Swath plot: average grade per 15 m strip</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>
    <div class="ov-note"><b style="color:#1a1a1a">●</b> composites (data) &nbsp; <b style="color:#e8732a">●</b> blocks (model, volume-weighted)</div>`;
}

function goStep(j) {
  if (j < 0 || j > 8 || j === PROC.step) return;
  applyStep(j, true);
  renderProcessPanel();
}

function renderProcessPanel() {
  const i = PROC.step, st = PROC_STEPS[i];
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="step">STEP ${i + 1} OF 9</div>
    <h2>${st.title}</h2>
    <p>${st.what}</p>
    <div class="usedfor"><b>Produces:</b> ${st.produces}</div>
    ${st.extra ? st.extra() : ''}
    <ul class="legend">${st.legend.map(e => `<li>${renderLegendSwatch(e)}<span>${e[1]}</span></li>`).join('')}</ul>
    <div class="controls">
      <button class="ctrl" id="p-back" ${i === 0 ? 'disabled' : ''}>&larr; Back</button>

      <button class="ctrl" id="p-reset">Reset view</button>
    </div>
    <div class="divider"></div>
    <ol class="steplist">${PROC_STEPS.map((x, j) =>
      `<li data-j="${j}" class="${j === i ? 'active' : ''} ${j < i ? 'done' : ''}"><span>${j + 1}</span>${x.short}</li>`).join('')}</ol>`;
  document.getElementById('p-back').onclick = () => goStep(i - 1);
  document.getElementById('p-next').onclick = () => goStep(i + 1);
  document.getElementById('p-reset').onclick = () => {
    const [p1, t1] = camFor(PROC.step);
    PROC.tween = { p0: camera.position.clone(), p1, t0: controls.target.clone(), t1, start: performance.now(), dur: 700 };
  };
  panel.querySelectorAll('ol.steplist li').forEach(li => { li.onclick = () => goStep(+li.dataset.j); });
}

window.addEventListener('keydown', e => {
  if (activeId !== 'process' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') goStep(PROC.step + 1);
  if (e.key === 'ArrowLeft') goStep(PROC.step - 1);
});

    const depths = [0, 30, 60, 90, h.depth];
    const st = depths.map((d, i) => ({ depth: d, az: h.az[i], dip: h.dip[i] }));
    st[0].pos = new THREE.Vector3(h.x, topoIn(h.x, h.z), h.z);
    // balanced tangent: each interval follows the average of the readings at its two ends
    for (let i = 1; i < st.length; i++) {
      const dir = dirFrom(st[i - 1].az, st[i - 1].dip).add(dirFrom(st[i].az, st[i].dip)).normalize();
      st[i].pos = st[i - 1].pos.clone().addScaledVector(dir, st[i].depth - st[i - 1].depth);
    }
    const at = d => {
      for (let i = 1; i < st.length; i++) if (d <= st[i].depth + 1e-9) {
        const t = (d - st[i - 1].depth) / (st[i].depth - st[i - 1].depth);
        return st[i - 1].pos.clone().lerp(st[i].pos, t);
      }
      return st[st.length - 1].pos.clone();
    };
    const codeAt = d => { const p = at(d); return d < 4 ? 'OVB' : insideLensP(p.x, p.y, p.z) ? 'ORE' : 'HOST'; };

    // geology log: merge 0.5 m steps of the same rock into intervals
    const geo = [];
    let cur = null;
    for (let d = 0; d < h.depth - 1e-9; d += 0.5) {
      const code = codeAt(d + 0.25);
      if (!cur || cur.code !== code) { cur = { from: d, to: d + 0.5, code }; geo.push(cur); }
      else cur.to = d + 0.5;
    }

    // assays: 2 m in waste, 1 m in ore; a few intervals never sampled
    const assays = [];
    let d = 0;
    while (d < h.depth - 0.01) {
      const L = codeAt(d + 0.5) === 'ORE' ? 1 : 2;
      const to = Math.min(h.depth, d + L);
      if (d > 6 && prng() < 0.04) assays.push({ from: d, to, g: null });
      else {
        const pm = at((d + to) / 2);
        assays.push({ from: d, to, g: trueGradeGT(pm.x, pm.y, pm.z) * (0.75 + 0.5 * prng()) });
      }
      d = to;
    }

    // density: a core piece every 15 m, plus one in the middle of every ORE interval
    const ds = [];
    for (let dd = 2; dd < h.depth; dd += 15) ds.push(dd);
    geo.filter(g => g.code === 'ORE').forEach(g => ds.push((g.from + g.to) / 2));
    ds.sort((a, b) => a - b);
    const dens = ds.map(dd => {
      const code = codeAt(dd);
      const rho = ROCK_RHO[code] + (prng() - 0.5) * (code === 'OVB' ? 0.16 : 0.08);
      const wAir = 900 + prng() * 600;
      const wWater = wAir * (1 - 1 / rho);
      return { depth: dd, code, wAir, wWater, rho: wAir / (wAir - wWater) };
    });
    return { ...h, st, at, geo, assays, dens };
  });
  IN = { holes };
  return IN;
}

/* ---- shared helpers for the input scenes ---- */
const INUI = { hl: null, spec: null, filter: null, sel: null };

function inputBase(api, topoOpacity = 0) {
  const { scene } = api;
  grid(scene, 260, 26);
  if (topoOpacity > 0) {
    const g = new THREE.PlaneGeometry(190, 190, 32, 32);
    g.rotateX(-Math.PI / 2);
    const pa = g.attributes.position;
    for (let i = 0; i < pa.count; i++) pa.setY(i, topoIn(pa.getX(i), pa.getZ(i)));
    g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({
      color: 0xe9dccb, transparent: true, opacity: topoOpacity, side: THREE.DoubleSide, depthWrite: false })));
  }
  const hl = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0x1a1a1a, wireframe: true, transparent: true, opacity: 0.6 }));
  hl.visible = false;
  scene.add(hl);
  INUI.hl = { m: hl, label: null, scene };
  return inputData();
}

function addNorthArrow(scene) {
  const o = new THREE.Vector3(-95, 18, 95);
  scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), o, 24, 0x1a1a1a, 6, 4));
  scene.add(new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), o, 24, 0x1a1a1a, 6, 4));
  scene.add(label3D('N', o.x, o.y + 4, o.z - 32));
  scene.add(label3D('E', o.x + 32, o.y + 4, o.z));
}

function drawHolePath(scene, h, color = 0x555555, radius = 0.55, opacity = 1) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, transparent: opacity < 1, opacity });
  for (let i = 1; i < h.st.length; i++) scene.add(cylinderBetween(h.st[i - 1].pos, h.st[i].pos, radius, mat));
}

function straightGuess(scene, h) {
  const p = h.st[0].pos;
  const g = new THREE.BufferGeometry().setFromPoints([p, p.clone().add(new THREE.Vector3(0, -h.depth, 0))]);
  const l = new THREE.Line(g, new THREE.LineDashedMaterial({ color: 0x8a8a8a, dashSize: 3, gapSize: 3 }));
  l.computeLineDistances();
  scene.add(l);
}

function showDataTable(spec) {
  INUI.spec = spec;
  INUI.filter = spec.groups ? spec.groups[0] : null;
  INUI.sel = null;
  overlay.classList.add('wide');
  renderDataTable();
}

function renderDataTable() {
  const s = INUI.spec;
  const rows = s.rows.map((r, i) => ({ r, i })).filter(o => !INUI.filter || o.r.group === INUI.filter);
  overlay.innerHTML = `<div class="ov-title">${s.title}</div>
    ${s.groups ? `<div class="ov-chips">${s.groups.map(g => `<button data-g="${g}" class="${g === INUI.filter ? 'on' : ''}">${g}</button>`).join('')}</div>` : ''}
    <div class="ov-scroll"><table class="ov-table click">
      <thead><tr>${s.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(o => `<tr data-i="${o.i}" class="${o.i === INUI.sel ? 'hl' : ''}">${o.r.cells.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="ov-note">${s.note}</div>`;
  overlay.style.display = 'block';
  overlay.querySelectorAll('.ov-chips button').forEach(b => { b.onclick = () => { INUI.filter = b.dataset.g; renderDataTable(); }; });
  overlay.querySelectorAll('tbody tr').forEach(tr => { tr.onclick = () => selectRow(+tr.dataset.i); });
}

function selectRow(i) {
  INUI.sel = i;
  const row = INUI.spec.rows[i], hl = INUI.hl, r = row.r || 3;
  hl.m.position.copy(row.pos);
  hl.m.scale.setScalar(r);
  hl.m.visible = true;
  if (hl.label) hl.scene.remove(hl.label);
  hl.label = label3D(row.label, row.pos.x, row.pos.y + r + 3, row.pos.z);
  hl.scene.add(hl.label);
  overlay.querySelectorAll('tbody tr').forEach(tr => tr.classList.toggle('hl', +tr.dataset.i === i));
  const off = camera.position.clone().sub(controls.target);
  tweenCam(row.pos.clone().add(off), row.pos.clone(), 700);
}

/* ---- 1. Collar ---- */
function sceneCollar(api) {
  const { scene } = api;
  const D = inputBase(api, 0.55);
  addNorthArrow(scene);
  const rows = [];
  D.holes.forEach(h => {
    const p = h.st[0].pos;
    const m = sphere(2.8, 0xe8732a); m.position.copy(p); scene.add(m);
    scene.add(label3D(h.id, p.x, p.y + 9, p.z));
    straightGuess(scene, h);
    rows.push({ cells: [h.id, toE(p.x), toN(p.z), toZ(p.y), h.depth], pos: p.clone(), r: 5, label: h.id });
  });
  api.camPos.set(150, 110, 175); api.target.set(0, -25, 0);
  showDataTable({
    title: 'Collar table', rows,
    columns: ['hole_id', 'x (east)', 'y (north)', 'z (elev)', 'max depth'],
    note: 'One row per hole. Click a row to find the hole. Metres on the mine grid.'
  });
}

/* ---- 2. Survey ---- */
function sceneSurvey(api) {
  const { scene } = api;
  const D = inputBase(api, 0.3);
  addNorthArrow(scene);
  const rows = [];
  const coneGeo = new THREE.ConeGeometry(1.7, 6, 12);
  const coneMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
  D.holes.forEach(h => {
    drawHolePath(scene, h, 0x555555, 0.6);
    straightGuess(scene, h);
    const c = sphere(2.2, 0xe8732a); c.position.copy(h.st[0].pos); scene.add(c);
    scene.add(label3D(h.id, h.st[0].pos.x, h.st[0].pos.y + 9, h.st[0].pos.z));
    h.st.forEach(s => {
      const cone = new THREE.Mesh(coneGeo, coneMat);
      cone.position.copy(s.pos);
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirFrom(s.az, s.dip));
      scene.add(cone);
      rows.push({ cells: [h.id, s.depth, s.az.toFixed(1), sgn(s.dip)], pos: s.pos.clone(), r: 4.5, label: `${h.id} at ${s.depth} m`, group: h.id });
    });
  });
  api.camPos.set(160, 60, 180); api.target.set(0, -40, 0);
  showDataTable({
    title: 'Survey table', rows, groups: D.holes.map(h => h.id),
    columns: ['hole_id', 'depth', 'azimuth (°)', 'dip (°)'],
    note: 'Azimuth = compass bearing from north. Dip below 0 = pointing down. Click a row to find the reading.'
  });
}

/* ---- 3. Assay ---- */
function sceneAssay(api) {
  const { scene } = api;
  const D = inputBase(api, 0.18);
  const rows = [];
  D.holes.forEach(h => {
    drawHolePath(scene, h, 0x8a8a8a, 0.35);
    scene.add(label3D(h.id, h.st[0].pos.x, h.st[0].pos.y + 9, h.st[0].pos.z));
    h.assays.forEach(a => {
      const p0 = h.at(a.from), p1 = h.at(a.to), pm = p0.clone().lerp(p1, 0.5);
      if (a.g !== null) {
        const len = p0.distanceTo(p1);
        const shrink = p0.clone().lerp(p1, 0.06), shrink2 = p0.clone().lerp(p1, 0.94);
        scene.add(cylinderBetween(len > 0.5 ? shrink : p0, len > 0.5 ? shrink2 : p1, 1.6,
          new THREE.MeshStandardMaterial({ color: gradeColor(a.g / 3), roughness: 0.5 })));
      }
      rows.push({
        cells: [h.id, a.from.toFixed(1), a.to.toFixed(1), a.g === null ? '<span style="color:#cc2e26">missing</span>' : a.g.toFixed(2)],
        pos: pm, r: 3, label: a.g === null ? `${h.id} ${a.from}–${a.to} m: missing` : `${h.id} ${a.from}–${a.to} m: ${a.g.toFixed(2)} g/t`, group: h.id
      });
    });
  });
  api.camPos.set(150, 40, 170); api.target.set(0, -40, 0);
  showDataTable({
    title: 'Assay table', rows, groups: D.holes.map(h => h.id),
    columns: ['hole_id', 'from', 'to', 'Au g/t'],
    note: 'One row per sample interval (depths in metres down the hole). Missing intervals stay missing, never zero.'
  });
}

/* ---- 4. Geology ---- */
function sceneGeology(api) {
  const { scene } = api;
  const D = inputBase(api, 0.18);
  const rows = [];
  const mats = {};
  Object.keys(ROCK).forEach(k => { mats[k] = new THREE.MeshStandardMaterial({ color: ROCK[k], roughness: 0.6 }); });
  D.holes.forEach(h => {
    scene.add(label3D(h.id, h.st[0].pos.x, h.st[0].pos.y + 9, h.st[0].pos.z));
    h.geo.forEach(g => {
      const p0 = h.at(g.from), p1 = h.at(g.to);
      scene.add(cylinderBetween(p0.clone().lerp(p1, 0.01), p0.clone().lerp(p1, 0.99), 1.9, mats[g.code]));
      rows.push({ cells: [h.id, g.from.toFixed(1), g.to.toFixed(1), g.code], pos: p0.clone().lerp(p1, 0.5), r: Math.max(3, p0.distanceTo(p1) / 2), label: `${h.id} ${g.code}`, group: h.id });
    });
  });
  api.camPos.set(150, 40, 170); api.target.set(0, -40, 0);
  showDataTable({
    title: 'Geology (lithology) table', rows, groups: D.holes.map(h => h.id),
    columns: ['hole_id', 'from', 'to', 'rock code'],
    note: 'Intervals follow the rock contacts, so their lengths vary. Click a row to find the interval.'
  });
}

/* ---- 5. Topography ---- */
function sceneTopography(api) {
  const { scene } = api;
  inputBase(api, 0);
  addNorthArrow(scene);
  const prng = mulberry32(5);
  // LiDAR / drone cloud
  const cloud = [];
  for (let i = 0; i < 2600; i++) {
    const x = (prng() - 0.5) * 180, z = (prng() - 0.5) * 180;
    cloud.push(x, topoIn(x, z) + (prng() - 0.5) * 0.6, z);
  }
  const cg = new THREE.BufferGeometry();
  cg.setAttribute('position', new THREE.Float32BufferAttribute(cloud, 3));
  scene.add(new THREE.Points(cg, new THREE.PointsMaterial({ color: 0xa8a8a8, size: 1.4 })));
  // surveyed strings
  const rows = [], groups = [];
  const dotGeo = new THREE.SphereGeometry(1.1, 10, 8), dotMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
  for (let s = 0; s < 7; s++) {
    const z = -75 + s * 25, name = 'string ' + (s + 1);
    groups.push(name);
    const pts = [];
    for (let x = -80, k = 1; x <= 80; x += 8, k++) {
      const p = new THREE.Vector3(x, topoIn(x, z) + 0.4, z);
      pts.push(p);
      const d = new THREE.Mesh(dotGeo, dotMat); d.position.copy(p); scene.add(d);
      rows.push({ cells: [s + 1, k, toE(x), toN(z), toZ(p.y - 0.4)], pos: p, r: 3, label: `string ${s + 1}, point ${k}`, group: name });
    }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x1a1a1a })));
  }
  scene.add(label3D('survey string', -80, 16, -75));
  scene.add(label3D('drone / LiDAR points', 55, 16, 80));
  api.camPos.set(150, 90, 175); api.target.set(0, 0, 0);
  showDataTable({
    title: 'Topography points (string file)', rows, groups,
    columns: ['string', 'point', 'x (east)', 'y (north)', 'z (elev)'],
    note: 'Only points so far. Triangulating them makes the DTM surface (see Outputs).'
  });
}

/* ---- 6. Interpretation ---- */
function sceneInterpretation(api) {
  const { scene } = api;
  const D = inputBase(api, 0.12);
  const oreMat = new THREE.MeshStandardMaterial({ color: 0xe8732a });
  const greyMat = new THREE.MeshStandardMaterial({ color: 0xb5b5b5, transparent: true, opacity: 0.5 });
  D.holes.forEach(h => h.geo.forEach(g => {
    const ore = g.code === 'ORE';
    scene.add(cylinderBetween(h.at(g.from), h.at(g.to), ore ? 1.6 : 0.6, ore ? oreMat : greyMat));
  }));
  const rows = [], groups = [];
  const planeMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.04, side: THREE.DoubleSide, depthWrite: false });
  const lineMat = new THREE.MeshStandardMaterial({ color: 0xd65f17 });
  const dotGeo = new THREE.SphereGeometry(0.9, 10, 8), dotMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
  [-36, -18, 0, 18, 36].forEach((z, si) => {
    const name = `${toN(z).replace('.0', '')} N`;
    groups.push(name);
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(130, 70), planeMat);
    plane.position.set(0, LENS_Y, z);
    scene.add(plane);
    scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(plane.geometry), new THREE.LineBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.25 })).translateY(LENS_Y).translateZ(z));
    // outline: top edge west to east, then bottom edge east to west
    const xs = [];
    for (let x = -55; x <= 55; x += 5) if (lensHalfAt(x, z) > 0.8) xs.push(x);
    const top = xs.map(x => new THREE.Vector3(x, LENS_Y + lensHalfAt(x, z), z));
    const bot = xs.slice().reverse().map(x => new THREE.Vector3(x, LENS_Y - lensHalfAt(x, z), z));
    const ring = top.concat(bot);
    if (ring.length < 4) return;
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ring, true), 120, 0.45, 6, true), lineMat));
    ring.forEach((p, k) => {
      const d = new THREE.Mesh(dotGeo, dotMat); d.position.copy(p); scene.add(d);
      rows.push({ cells: [si + 1, k + 1, toN(p.z), toE(p.x), toZ(p.y)], pos: p.clone(), r: 2.5, label: `string ${si + 1}, point ${k + 1}`, group: name });
    });
    if (si === 0) scene.add(label3D(`section ${name}`, -66, LENS_Y + 26, z));
  });
  api.camPos.set(125, -5, 150); api.target.set(0, -40, 0);
  showDataTable({
    title: 'Ore outlines (string file, one string per section)', rows, groups,
    columns: ['string', 'point', 'y (north)', 'x (east)', 'z (elev)'],
    note: 'Note the Surpac order: y (northing) comes before x. Each closed string is one section’s outline.'
  });
}

/* ---- 7. Density ---- */
function sceneDensity(api) {
  const { scene } = api;
  const D = inputBase(api, 0.15);
  const mats = {};
  Object.keys(ROCK).forEach(k => { mats[k] = new THREE.MeshStandardMaterial({ color: ROCK[k], transparent: true, opacity: 0.35 }); });
  const coreGeo = new THREE.CylinderGeometry(2.6, 2.6, 3.4, 16);
  const rows = [];
  let n = 1;
  D.holes.forEach(h => {
    scene.add(label3D(h.id, h.st[0].pos.x, h.st[0].pos.y + 9, h.st[0].pos.z));
    h.geo.forEach(g => scene.add(cylinderBetween(h.at(g.from), h.at(g.to), 0.7, mats[g.code])));
    h.dens.forEach(s => {
      const p = h.at(s.depth), tan = h.at(Math.min(h.depth, s.depth + 1)).sub(h.at(Math.max(0, s.depth - 1))).normalize();
      const m = new THREE.Mesh(coreGeo, new THREE.MeshStandardMaterial({ color: ROCK[s.code], roughness: 0.5 }));
      m.position.copy(p);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
      scene.add(m);
      const id = 'D' + String(n++).padStart(3, '0');
      rows.push({
        cells: [id, h.id, s.depth.toFixed(1), s.code, s.wAir.toFixed(0), s.wWater.toFixed(0), s.rho.toFixed(2)],
        pos: p, r: 4.5, label: `${id}: ${s.rho.toFixed(2)} t/m³`, group: h.id
      });
    });
  });
  api.camPos.set(150, 40, 170); api.target.set(0, -40, 0);
  showDataTable({
    title: 'Density measurements', rows, groups: D.holes.map(h => h.id),
    columns: ['sample', 'hole', 'depth', 'rock', 'W air g', 'W water g', 't/m³'],
    note: 'Density = W air ÷ (W air − W water). Click a row to find the core piece.'
  });
}

function densityAverages() {
  const all = inputData().holes.flatMap(h => h.dens);
  return ['ORE', 'HOST', 'OVB'].map(code => {
    const s = all.filter(d => d.code === code);
    return { code, n: s.length, avg: s.reduce((a, d) => a + d.rho, 0) / s.length };
  });
}

  {
    id: 'density', label: 'Density', kind: 'input', group: 'Inputs', build: sceneDensity, heading: 'Density',
    what: 'How heavy the rock is. Pieces of core are weighed in air, then again hanging in water (the water-immersion or Archimedes method). Density = weight in air ÷ (weight in air − weight in water). The results are averaged by rock type and every block of that type gets the average.',
    used: 'Feeds the <b>report</b> (process step 8): tonnes = volume × density.',
    legend: [['#e8732a', 'ORE core piece'], ['#9a9a9a', 'HOST core piece'], ['#c9a77c', 'OVB core piece']],
    extra: () => `<div class="stat">${densityAverages().map(a => `<div><b>${a.avg.toFixed(2)}</b><small>${a.code} average t/m³ (${a.n} pieces)</small></div>`).join('')}</div>`
  }
];

const TABS = [
  ...INPUT_TABS,
  {
    id: 'holes',
    label: 'Desurveyed holes',
    build: sceneHoles,
    heading: 'Desurveyed holes',
    what: 'The 3D path and sample positions of every drillhole, reconstructed from collar position, downhole surveys (azimuth/dip readings at intervals) and sample intervals. Each dark tube is one hole’s path curving with depth; the small spheres are raw assay samples coloured by grade.',
    used: 'Used for <b>viewing, compositing, and as direct input to grade estimation.</b>',
    legend: [
      ['#1a1a1a', 'Drillhole path (desurveyed)'],
      ['#e8732a', 'Collar (surface position)'],
      ['grade', 'Sample, coloured by grade']
    ]
  },
  {
    id: 'composites',
    label: 'Composites',
    build: sceneComposites,
    heading: 'Composites',
    what: 'Raw samples (left hole) come off the ground at irregular lengths — whatever the lab cut. Compositing regularises them into equal-length intervals (right hole, e.g. 2 m), each with a length-weighted average grade. This is what makes samples comparable to one another and to a block.',
    used: 'Used as <b>fair, consistent input to grade estimation</b> — you can’t honestly average samples of different lengths without weighting them first.',
    legend: [
      ['grade', 'Segment coloured by (illustrative) grade'],
      ['#bdbdbd', 'Hole path']
    ]
  },
  {
    id: 'dtm',
    label: 'DTM surfaces',
    build: sceneDTM,
    heading: 'DTM surfaces',
    what: 'A Digital Terrain Model: survey points joined into a triangle mesh by Delaunay triangulation (no point sits inside another triangle’s circumcircle). It is a single sheet — given any (x, z), you find the triangle above it and read the elevation off that triangle’s plane, as the orange probe line shows.',
    used: 'Used for <b>cutting the block model above ground</b> (topography), and the same technique builds the roof/floor surfaces of an ore solid (next tab) or a fault plane.',
    legend: [
      ['#f3a46d', 'Triangulated surface'],
      ['#1a1a1a', 'Triangle edges (wireframe)'],
      ['#1a1a1a', 'Source survey points (dots)'],
      ['#e8732a', 'Elevation probe at one (x,y)']
    ]
  },
  {
    id: 'solid',
    label: 'Solids (wireframes)',
    build: sceneSolid,
    heading: 'Solids (wireframes)',
    what: 'A closed triangle mesh enclosing a volume — here, an ore body built from two DTM surfaces (a “roof” and a “floor”) stitched together at their shared edge. Unlike a single DTM surface, a solid has an inside and an outside, so you can ask “is this point inside the ore?”',
    used: 'Used for <b>coding blocks ORE/WASTE and computing volumes</b> — this is the shape the block model gets compared against.',
    legend: [
      ['#e8732a', 'Closed solid (roof + floor stitched)'],
      ['#1a1a1a', 'Wireframe (shows the triangle mesh)']
    ]
  },
  {
    id: 'blocks',
    label: 'Block model',
    build: sceneBlocks,
    heading: 'Block model',
    what: 'A regular 3D grid of blocks (illustrative here, a coarser grid than the 10×10×5 m typical size) laid over the same volume. Each block is tested against the ore solid: fully inside → ORE, fully outside → WASTE (shown faint and sparse here for clarity), and blocks straddling the boundary are split into smaller sub-blocks so the ore/waste contact is honoured more precisely than one coarse block would allow.',
    used: 'Used for the <b>resource statement and mine planning</b> — every block carries rock code, density, grade and estimation diagnostics.',
    legend: [
      ['#e8732a', 'ORE block (fully inside solid)'],
      ['#d65f17', 'ORE sub-block (boundary)'],
      ['#cfcfcf', 'WASTE block / sub-block']
    ]
  },
  {
    id: 'process',
    label: '3D modelling process',
    group: 'Process',
    build: sceneProcess,
    panel: renderProcessPanel
  }
];

function renderLegendSwatch(entry) {
  if (entry[0] === 'grade') {
    return `<span class="swatch" style="background:linear-gradient(90deg,#2659bf,#41a673,#e6bf33,#e87329,#cc2e26)"></span>`;
  }
  return `<span class="swatch" style="background:${entry[0]}"></span>`;
}

function renderPanel(tab) {
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="step">${tab.kind === 'input' ? 'INPUT' : 'OUTPUT'}</div>
    <h2>${tab.heading}</h2>
    <p>${tab.what}</p>
    <div class="usedfor">${tab.used}</div>
    ${tab.extra ? tab.extra() : ''}
    <div class="divider"></div>
    <ul class="legend">
      ${tab.legend.map(e => `<li>${renderLegendSwatch(e)}<span>${e[1]}</span></li>`).join('')}
    </ul>
    <div class="controls">
      <button class="ctrl" id="btn-reset">Reset view</button>
      <button class="ctrl" id="btn-spin">Toggle auto-rotate</button>
    </div>
  `;
  document.getElementById('btn-reset').onclick = () => activate(tab.id, true);
  document.getElementById('btn-spin').onclick = () => {
    if (!controls) return;
    controls.autoRotate = !controls.autoRotate;
    controls.autoRotateSpeed = 2.2;
  };
}

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  ['Inputs', 'Outputs', 'Process'].forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'tab-group';
    wrap.innerHTML = `<span class="group-label">${g}</span>`;
    TABS.filter(t => (t.group || 'Outputs') === g).forEach(tab => {
      const btn = document.createElement('button');
      btn.textContent = tab.label;
      btn.dataset.id = tab.id;
      btn.onclick = () => activate(tab.id);
      wrap.appendChild(btn);
    });
    nav.appendChild(wrap);
  });
}

let activeId = null;
function activate(id) {
  activeId = id;
  const tab = TABS.find(t => t.id === id);
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
  hideOverlay();
  setScene(tab.build);
  if (tab.panel) tab.panel(); else renderPanel(tab);
  if (location.hash.replace('#', '') !== id) location.hash = id;
}

renderTabs();
const initial = (location.hash || '').replace('#', '');
const validIds = TABS.map(t => t.id);
activate(validIds.includes(initial) ? initial : TABS[0].id);

window.addEventListener('hashchange', () => {
  const id = location.hash.replace('#', '');
  if (validIds.includes(id) && id !== activeId) activate(id);
});
</script>
